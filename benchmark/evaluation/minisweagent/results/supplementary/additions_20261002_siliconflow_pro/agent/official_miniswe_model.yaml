prediction_model_name: deepseek-v4-pro
model:
  model_name: openai/deepseek-v4-pro
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: https://api.deepseek.com
    drop_params: true
    temperature: 0.0
    max_tokens: 16384
    timeout: 300
    extra_body:
      thinking:
        type: disabled
    api_key: $DEEPSEEK_API_KEY
  model_class: litellm
_model_source: deepseek-official
environment:
  run_args:
  - --rm
  - --cap-add=NET_ADMIN
